[build-system]
requires = ["setuptools==68.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "throngfission"
version = "0.0.1"
authors = [
  { name="Evgeniy Blinov", email="zheni-b@yandex.ru" },
]
description = ''
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    'throng>=0.0.9',
    'cantok>=0.0.43',
    'dirstree>=0.0.12',
    'locklib>=0.0.25',
    'skelet>=0.0.21',
    'kubernetes>=32.0.1',
    'websocket-client>=1.8.0',
]
classifiers = [
    "Operating System :: OS Independent",
    'Operating System :: MacOS :: MacOS X',
    'Operating System :: Microsoft :: Windows',
    'Operating System :: POSIX',
    'Operating System :: POSIX :: Linux',
    'Programming Language :: Python',
    'Programming Language :: Python :: 3.8',
    'Programming Language :: Python :: 3.9',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Programming Language :: Python :: 3.15',
    'Programming Language :: Python :: Free Threading',
    'Programming Language :: Python :: Free Threading :: 3 - Stable',
    'License :: OSI Approved :: MIT License',
    'Intended Audience :: Developers',
    'Topic :: Software Development :: Libraries',
    'Typing :: Typed',
]
keywords = [
    'subprocesses',
    'subprocesses wrapper',
    'execute commands',
    'isolated environments',
    'sandboxes',
    'fission',
    'throng',
]

[tool.setuptools.package-data]
"throngfission" = ["py.typed", "*.sh", "*.json", "LICENSE.fission"]

[project.scripts]
throngfission = "throngfission.cli:main"

[project.entry-points.throng]
fission = "throngfission.plugin"

[tool.setuptools.packages.find]
include = ["throngfission*"]

[tool.mutmut]
paths_to_mutate=["throngfission"]

[tool.coverage.run]
branch = "${THRONG_COVERAGE_BRANCH-false}"
omit = ["*tests*"]
parallel = true
plugins = ["coverage_pyver_pragma"]
source = ["throngfission"]

[tool.coverage.report]
# Protocol declarations contain no executable implementation.
exclude_also = ['class \w+\(Protocol\):']

[tool.pytest.ini_options]
norecursedirs = ["build", "mutants"]

[tool.ruff]
lint.ignore = ['E501', 'E712', 'PTH123', 'PTH118', 'PLR2004', 'PTH107', 'SIM105', 'SIM102', 'RET503', 'PLR0912', 'C901', 'E731', 'F821']
lint.select = ["ERA001", "YTT", "ASYNC", "BLE", "B", "A", "COM", "INP", "PIE", "T20", "PT", "RSE", "RET", "SIM", "SLOT", "TID252", "ARG", "PTH", "I", "C90", "N", "E", "W", "D201", "D202", "D419", "F", "PL", "PLE", "PLR", "PLW", "RUF", "TRY201", "TRY400", "TRY401"]
lint.isort.combine-as-imports = true
format.quote-style = "single"

[project.urls]
'Source' = 'https://github.com/mutating/throngfission'
'Tracker' = 'https://github.com/mutating/throngfission/issues'
